# /etc/nginx/sites-available/makanlandscape.sa
# Symlink: ln -s /etc/nginx/sites-available/makanlandscape.sa /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name makanlandscape.sa www.makanlandscape.sa;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name makanlandscape.sa www.makanlandscape.sa;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/makanlandscape.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makanlandscape.sa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Enable gzip at Nginx level too
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Max upload size (for admin image uploads)
    client_max_body_size 50M;

    # Serve Next.js static chunks directly — bypass Node entirely
    location /_next/static/ {
        alias /var/www/makan/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve public images directly from Nginx
    location /home/ {
        alias /var/www/makan/public/home/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /var/www/makan/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # All other requests → Next.js (PM2 on port 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
